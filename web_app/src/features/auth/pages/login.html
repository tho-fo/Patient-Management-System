<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management System - Login</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../../assets/styles/login.css">
</head>

<body class="login-page">
    <div class="login-container">
        <!-- Login Card -->
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="hospital-icon">
                    <i class="bi bi-hospital"></i>
                </div>
                <h1 class="app-name">Patient Management System</h1>
                <p class="app-description">Hospital Management & Patient Care Platform</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form" novalidate>
                
                <!-- Alert Messages -->
                <div id="errorAlert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span id="errorMessage"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div id="successAlert" class="alert alert-success alert-dismissible fade show d-none" role="alert">
                    <i class="bi bi-check-circle-fill"></i>
                    <span id="successMessage">Login successful! Redirecting...</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Email/Username Field -->
                <div class="form-group mb-3">
                    <label for="email" class="form-label">
                        <i class="bi bi-envelope"></i> Email or Username
                    </label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email or username"
                        required
                        autocomplete="username"
                    >
                    <div class="invalid-feedback" id="emailError">
                        Please enter a valid email or username.
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group mb-3">
                    <label for="password" class="form-label">
                        <i class="bi bi-lock"></i> Password
                    </label>
                    <div class="input-group">
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                        <button 
                            class="btn btn-outline-secondary" 
                            type="button" 
                            id="togglePassword"
                            title="Toggle password visibility"
                        >
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback" id="passwordError">
                        Please enter your password.
                    </div>
                </div>

                <!-- Remember Me -->
                <div class="form-check mb-3">
                    <input 
                        type="checkbox" 
                        class="form-check-input" 
                        id="rememberMe" 
                        name="rememberMe"
                    >
                    <label class="form-check-label" for="rememberMe">
                        Remember me
                    </label>
                </div>

                <!-- Login Button -->
                <button 
                    type="submit" 
                    class="btn btn-primary w-100 mb-3"
                    id="loginBtn"
                >
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </button>

                <!-- Loading Spinner -->
                <div id="loadingSpinner" class="text-center d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 text-muted">Verifying credentials...</p>
                </div>

            </form>

            <!-- Footer Links -->
            <div class="login-footer">
                <p class="mb-2">
                    <a href="#" class="forgot-password-link">
                        <i class="bi bi-question-circle"></i> Forgot Password?
                    </a>
                </p>
                <hr class="my-3">
                <p class="mb-0">
                    Don't have an account? 
                    <a href="#" class="contact-admin-link">Contact Administrator</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Core Configuration -->
    <script src="../../config/api.config.js"></script>
    <script src="../../core/constants/app.constants.js"></script>
    <script src="../../core/errors/error-handler.js"></script>

    <!-- Services -->
    <script src="../../services/api.service.js"></script>
    <script src="../../utils/helpers.js"></script>
    <script src="../auth/services/auth.service.js"></script>

    <!-- Login Script -->
    <script src="../../features/auth/pages/login.js"></script>
</body>

</html>
